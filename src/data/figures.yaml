    main: { file: "illum/pipeline-overview.png", alt: "다중 시점 영상에서 SfM, 가우시안 초기화, 렌더링으로 이어지는 3DGS 흐름 아래에 소프트 마스크 생성, 가중치 맵, 픽셀 손실, 기하 정규화 블록이 연결된 구성도" }

