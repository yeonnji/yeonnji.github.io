# main에 푸시하면 GitHub Pages로 배포한다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정해야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          CI: "true"
      # 공개 확인 전 그림이 섞이지 않았는지 다시 확인 (review 폴더는 git에 없어야 한다)
      - name: Guard review assets
        run: test ! -d src/assets/figures/review || test -z "$(ls -A src/assets/figures/review)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
